name: Build Zero Team APK

on:
  push:
    branches:
      - zeroteam-android-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android native build tools
        run: |
          sdkmanager "platforms;android-33" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Download official FBNeo Android cores
        shell: bash
        run: |
          set -euo pipefail
          for ABI in arm64-v8a armeabi-v7a; do
            mkdir -p "app/src/main/jniLibs/$ABI" "/tmp/fbneo-$ABI"
            curl --fail --location --retry 3 \
              "https://buildbot.libretro.com/nightly/android/latest/$ABI/fbneo_libretro_android.so.zip" \
              --output "/tmp/fbneo-$ABI.zip"
            unzip -q "/tmp/fbneo-$ABI.zip" -d "/tmp/fbneo-$ABI"
            CORE="$(find "/tmp/fbneo-$ABI" -type f -name '*.so' | head -n 1)"
            test -n "$CORE"
            install "$CORE" "app/src/main/jniLibs/$ABI/libfbneo_libretro_android.so"
            file "app/src/main/jniLibs/$ABI/libfbneo_libretro_android.so"
          done

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTeam-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
